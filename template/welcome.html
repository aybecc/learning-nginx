<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myslambook.com - Welcome</title>
  <link rel="stylesheet" href="./../static/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>myslambook.com</h1>
      <p class="tagline">Your personal slam book, online.</p>
    </header>

    <main>
      <div class="welcome-card">
        <h2>Welcome</h2>
        <p>Create an account or sign in to get started.</p>

        <div class="tabs">
          <button class="tab-btn active" data-tab="signin">Sign In</button>
          <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <form id="signin-form" class="auth-form active">
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary">Sign In</button>
          <p class="message" id="signin-message"></p>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirm" placeholder="Repeat password" required>
          </div>
          <button type="submit" class="btn btn-primary">Create Account</button>
          <p class="message" id="signup-message"></p>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 myslambook.com — Static demo page</p>
    </footer>
  </div>

  <script src="./../static/script.js"></script>
</body>
</html>
